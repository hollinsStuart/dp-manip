[experiment]
name = "data_size"
variable = "data.num_demos"
values = [25, 50, 100, 200]

[replicates]
"25" = [1, 2, 3]
"50" = [1, 2, 3]
"100" = [1, 2, 3, 4, 5]
"200" = [1, 2, 3, 4, 5]

[diagnostics]
# `--split train` overfitting diagnostic: the first 25 demo seeds are contained
# in every nested subset, so train-seed success is comparable across N.
train_eval_episodes = 25
