# PlugCharger-v1, state obs, pd_ee_delta_pose. Values from docs/final-plan.md §1-§2.
# obs_dim was measured on the 9.24 probe (pd_joint_pos replay); state obs should not depend
# on the controller, and the dataset re-checks every dim, env and control mode at load time.
# Training hyperparameters (§3) live in the workspace config, not here.
# Not probed yet. obs_dim is ??? until the first export; max_episode_steps 200 is the
# ManiSkill default and is final only after collection, by the §1 rule
# max(official, 2 x mean demo length) rounded up to 50.

name: maniskill_plugcharger_lowdim

env_id: PlugCharger-v1
control_mode: pd_ee_delta_pose
obs_dim: ???
action_dim: 7
keypoint_dim: 3  # referenced by upstream lowdim workspaces; unused (no keypoints)
max_episode_steps: 200

# N in {25, 50, 100, 200, 400}: override with task.num_demos=25.
num_demos: 100
data_dir: data/maniskill/plugcharger
dataset_path: ${task.data_dir}/plugcharger_train_n${task.num_demos}.hdf5
val_dataset_path: ${task.data_dir}/plugcharger_val.hdf5

env_runner:
  # Not written yet; the upstream workspace builds the runner before training starts.
  _target_: sdp_maniskill.env_runner.ManiSkillLowdimRunner
  env_id: ${task.env_id}
  control_mode: ${task.control_mode}
  sim_backend: physx_cpu
  max_episode_steps: ${task.max_episode_steps}
  ignore_termination: True  # every episode runs to max_episode_steps (§4)
  # Validation rollouts ③ during training. Test rollouts ④ (seeds 10000-10099) are a
  # separate evaluation of final.pt, not part of training.
  seed_start: 5000
  n_episodes: 50
  n_envs: 10
  sampling_seed: 0  # DDPM sampling noise at inference (§2.2)
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  n_latency_steps: ${n_latency_steps}
  past_action: ${past_action_visible}

dataset:
  _target_: sdp_maniskill.dataset.ManiSkillLowdimDataset
  dataset_path: ${task.dataset_path}
  val_dataset_path: ${task.val_dataset_path}
  env_id: ${task.env_id}
  control_mode: ${task.control_mode}
  obs_dim: ${task.obs_dim}
  action_dim: ${task.action_dim}
  num_demos: ${task.num_demos}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  obs_keys: [state]
  obs_std_eps: 1.0e-3
