# PegInsertionSide-v1, rgb observations, pd_joint_pos (8-D actions). docs/final-plan.md §1, §3;
# control mode as generated by maniskill-demogen (tasks.py, decided 9.25).
# Image policy follows ManiSkill's train_rgbd.py: PlainConv over all cameras'
# channels, 256-d feature per frame + obs_rgb/state, batch 256.

[task]
env_id = "PegInsertionSide-v1"
control_mode = "pd_joint_pos"
obs_mode = "rgb"
sim_backend = "physx_cpu"
max_episode_steps = 300

[data]
# maniskill-demogen export (train split, 400 demos); take the first N with data.num_demos.
demo_path = "data/dataset/train/PegInsertionSide-v1/motionplanning/trajectory.state.pd_joint_pos.physx_cpu.h5"

[policy]
obs_horizon = 2
act_horizon = 8
pred_horizon = 16
diffusion_step_embed_dim = 64
unet_dims = [64, 128, 256]
n_groups = 8
num_diffusion_iters = 100
visual_feature_dim = 256

[train]
seed = 1
total_iters = 100000
batch_size = 256
lr = 1e-4
weight_decay = 1e-6
warmup_steps = 500
log_freq = 1000
# Rollouts render every camera frame; validate less often than the state runs.
eval_freq = 10000
save_freq = 0

[eval]
val_seed_start = 5000
val_episodes = 50
test_seed_start = 10000
test_episodes = 100
num_envs = 10
